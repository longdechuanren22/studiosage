name: StudioSage
options:
  bundleIdPrefix: com.studiosage
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  StudioSage:
    type: application
    platform: macOS
    sources:
      - path: StudioSage
        type: group
    settings:
      base:
        INFOPLIST_FILE: StudioSage/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.studiosage.app
        PRODUCT_NAME: StudioSage
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
    dependencies: []
