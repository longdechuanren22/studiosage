name: Build macOS App

on:
  push:
    branches: [master]
    paths: [macos/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: macos
        run: xcodegen generate

      - name: Build App
        working-directory: macos
        run: |
          xcodebuild -project StudioSage.xcodeproj \
            -scheme StudioSage \
            -configuration Release \
            -derivedDataPath DerivedData \
            SWIFT_VERSION=5.0 \
            clean build

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: StudioSage-macOS
          path: macos/DerivedData/Build/Products/Release/StudioSage.app
