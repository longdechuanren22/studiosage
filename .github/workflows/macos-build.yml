name: Build macOS App

on:
  push:
    branches: [master]
    paths: [macos/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift App
        working-directory: macos
        run: |
          swiftc -target arm64-apple-macos14.0 \
            -o StudioSage \
            StudioSage/Models/Message.swift \
            StudioSage/Services/APIClient.swift \
            StudioSage/Services/NotificationService.swift \
            StudioSage/AppState.swift \
            StudioSage/Views/MenuBarView.swift \
            StudioSage/Views/DashboardView.swift \
            StudioSage/Views/InboxView.swift \
            StudioSage/Views/MessageRow.swift \
            StudioSage/Views/InvoiceListView.swift \
            StudioSage/Views/SettingsView.swift \
            StudioSage/StudioSageApp.swift \
            -framework SwiftUI -framework AppKit -framework UserNotifications

      - name: Verify
        run: ls -la macos/StudioSage && echo "BUILD SUCCESS"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: StudioSage-macOS
          path: macos/StudioSage
