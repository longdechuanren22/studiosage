# StudioSage — CI pipeline
name: StudioSage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install
      - run: cd server && pnpm install && npx tsc --noEmit
      - run: cd client && pnpm install && npx tsc --noEmit && npx vite build
